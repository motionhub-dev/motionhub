name: claude review
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: write
  pull-requests: read
concurrency:
  group: claude-review-${{ github.event.issue.number }}
  cancel-in-progress: true
jobs:
  review:
    if: >-
      vars.CLAUDE_ENABLED == 'true' && vars.CLAUDE_MODEL != '' &&
      github.event.issue.pull_request && github.event.issue.state == 'open' &&
      startsWith(github.event.comment.body, '/review') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    uses: ./.github/workflows/claude-task.yml
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
