# Production credentials are available only on fresh publishing runners, never during builds or dependency scripts.
name: deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main' && vars.PUBLISHING != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - uses: ./.github/actions/security-scan
      - run: npm test
      - run: node tools/check.mjs
      - run: npm ci --prefix player --no-audit --no-fund
      - run: npm ci --prefix site --no-audit --no-fund
      - run: npm ci --prefix site/ci --ignore-scripts --no-audit --no-fund
      # the faces the reels' players copy in, fetched from Google Fonts once and kept between runs, as check.yml does
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: player/.cache/fonts
          key: fonts-${{ hashFiles('motions/**/tokens.json') }}
          restore-keys: fonts-
      - name: Build the site
        working-directory: site
        env:
          PUBLIC_PLAYER_ORIGIN: https://player.motionhub.dev
          # read-only, this repository only: creators are shown by their login now, looked up by account id
          # (site/src/lib/catalogue.mjs), within the authenticated rate limit. It reaches no production credential
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build
      - name: Bundle the Worker without credentials
        run: node site/ci/node_modules/wrangler/bin/wrangler.js deploy --dry-run --outdir "$RUNNER_TEMP/release/worker"
      - name: Record every release file and its source
        run: node site/ci/release.mjs create "$RUNNER_TEMP/release" site
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: artifact
        with:
          name: site-${{ github.sha }}
          path: ${{ runner.temp }}/release
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - run: npm ci --prefix site/ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact }}
          path: ${{ runner.temp }}/release
          merge-multiple: true
      - run: node site/ci/release.mjs verify "$RUNNER_TEMP/release" site
      - name: Publish immutable packages
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node site/ci/release.mjs publish "$RUNNER_TEMP/release" site
      - name: Deploy the isolated static player first
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node site/ci/node_modules/wrangler/bin/wrangler.js deploy --config wrangler.player.jsonc --assets "$RUNNER_TEMP/release/player-assets"
      - name: Deploy the prebuilt site and Worker
        env:
          SUBMISSIONS_SETTING: ${{ vars.SUBMISSIONS || 'off' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          case "$SUBMISSIONS_SETTING" in on|off) ;; *) exit 1 ;; esac
          node site/ci/node_modules/wrangler/bin/wrangler.js deploy "$RUNNER_TEMP/release/worker/worker.js" --config wrangler.jsonc --no-bundle --assets "$RUNNER_TEMP/release/assets" --var "SUBMISSIONS:$SUBMISSIONS_SETTING"
