name: publish

# A tag `v<version>` stages that version of @motionhub/cli on npm; a tag `<package>-v<version>`
# (`runtime-v0.1.1`, `remotion-v…`, `hyperframes-v…`) stages that version of @motionhub/<package> from packages/<package>. The workflow holds no npm
# token: npm trusts this repository and this file by OpenID Connect (npm, package settings, "Trusted Publisher"), so what it
# can do is what npm allows it. It only stages; the release goes out when a maintainer approves the staged version with 2FA
# (`npm stage approve <id>`).
on:
  push:
    tags: ["v*", "runtime-v*", "remotion-v*", "hyperframes-v*"]

permissions:
  contents: read
  id-token: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # npm stage is in npm 11, which Node 24 ships; Node 22's npm 10 does not have it
      - uses: actions/setup-node@v5
        with:
          node-version: 24.19.0
          registry-url: "https://registry.npmjs.org"
      - name: What the tag publishes
        id: what
        run: |
          case "$GITHUB_REF_NAME" in
            v*) echo "dir=." >> "$GITHUB_OUTPUT"; echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT" ;;
            *) echo "dir=./packages/${GITHUB_REF_NAME%%-v*}" >> "$GITHUB_OUTPUT"; echo "version=${GITHUB_REF_NAME#*-v}" >> "$GITHUB_OUTPUT" ;;
          esac
      - run: npm test
      - run: node tools/check.mjs
      - name: The runtime's tests
        if: startsWith(github.ref_name, 'runtime-v')
        working-directory: packages/runtime
        run: npm install --no-package-lock --no-save && npm test
      - name: The Remotion binding's tests
        if: startsWith(github.ref_name, 'remotion-v')
        working-directory: packages/remotion
        run: npm install --no-package-lock --no-save --install-links && npm test
      - name: The tag names the version being published
        run: test "$(node -p "require('./${{ steps.what.outputs.dir }}/package.json').version")" = "${{ steps.what.outputs.version }}"
      - run: npm stage publish ${{ steps.what.outputs.dir }}
