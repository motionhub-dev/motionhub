name: publish
on:
  push:
    tags: ["v*", "runtime-v*", "remotion-v*", "hyperframes-v*"]
permissions:
  contents: read
jobs:
  package:
    if: vars.PUBLISHING != 'off'
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.19.0
      - name: Only reviewed main history may be packaged
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: npm test
      - run: node tools/check.mjs
      - name: The runtime's tests
        if: startsWith(github.ref_name, 'runtime-v')
        working-directory: packages/runtime
        run: npm install --no-package-lock --no-save && npm test
      - name: The Remotion binding's tests
        if: startsWith(github.ref_name, 'remotion-v')
        working-directory: packages/remotion
        run: npm install --no-package-lock --no-save --install-links && npm test
      - run: node site/ci/npm-package.mjs "$RUNNER_TEMP/package"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: artifact
        with:
          name: npm-${{ github.sha }}
          path: ${{ runner.temp }}/package
          retention-days: 3
          if-no-files-found: error
  stage:
    needs: package
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.19.0
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.package.outputs.artifact }}
          path: ${{ runner.temp }}/package
          merge-multiple: true
      - run: node site/ci/release.mjs verify "$RUNNER_TEMP/package" npm
      - name: Stage a prepacked tarball without lifecycle scripts
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
        run: |
          for package in "$RUNNER_TEMP/package"/*.tgz; do
            npm stage publish "$package"
          done
