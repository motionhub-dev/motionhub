# @claude on an issue (not a pull request) provides advice. It cannot execute code, push, approve, merge, deploy or review a pull request.
name: claude
on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
concurrency:
  group: claude-${{ github.event.issue.number }}
  cancel-in-progress: true
jobs:
  advise:
    if: |
      vars.CLAUDE_ENABLED == 'true' && vars.CLAUDE_MODEL != '' &&
      !github.event.issue.pull_request && (
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)))
    uses: ./.github/workflows/claude-task.yml
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
