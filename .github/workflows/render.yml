# After each deploy of main and by hand on main: render the video of every motion whose version has none yet (site/player/missing.mjs),
# one job per motion, and put it in R2 at m/<id>/<version>.mp4, where the Worker serves it. Only a version whose package
# is published is rendered. A version's video is made
# once: one already published is never replaced, and a change to the runtime or the player does not render again. A
# motion that fails to render gets no video, and its page keeps playing it live; the next run tries it again.
name: render

on:
  workflow_run:
    workflows: [deploy]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  plan:
    # only main's videos: a version is rendered once its package is published, which only main's deploy does
    if: vars.PUBLISHING != 'off' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ids: ${{ steps.missing.outputs.ids }}
    steps:
      # the commit that was deployed, so each video is of the version the site now serves
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - id: missing
        run: |
          ids=$(node site/player/missing.mjs https://motionhub.dev)
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
          echo "to render: $ids"

  render:
    needs: plan
    if: needs.plan.outputs.ids != '[]'
    runs-on: ubuntu-latest
    # a reel thick with blur takes seconds a frame in software: Depth Stage needs nearly three hours
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        id: ${{ fromJSON(needs.plan.outputs.ids) }}
    env:
      ID: ${{ matrix.id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: site/.cache/fonts
          key: fonts-${{ hashFiles('motions/**/tokens.json') }}
          restore-keys: fonts-
      - name: ffmpeg
        run: command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
      # the hub's files (for the policy /play/* is served with) and this motion's player, not the whole site
      - name: Build the player
        working-directory: site
        run: npm ci --no-audit --no-fund && node ../tools/build.mjs ../dist && node player/build.mjs "$ID"
      - name: Render
        working-directory: site
        run: node player/render.mjs "$ID" --out "$RUNNER_TEMP/render"
      - name: Record the rendered artifact
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: node site/ci/release.mjs create "$RUNNER_TEMP/render" video
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: video-${{ strategy.job-index }}
          path: ${{ runner.temp }}/render
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error

  publish:
    needs: [plan, render]
    if: needs.plan.outputs.ids != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - run: npm ci --prefix site/ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: video-*
          path: ${{ runner.temp }}/videos
      - name: Verify every video before exposing credentials
        run: |
          for video in "$RUNNER_TEMP/videos"/*; do
            node site/ci/release.mjs verify "$video" video
          done
      - name: Publish videos without executing motion code
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for video in "$RUNNER_TEMP/videos"/*; do
            node site/ci/release.mjs publish "$video" video
          done
