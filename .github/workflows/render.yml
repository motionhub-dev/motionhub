# After each deploy and by hand: render the video of every motion whose version has none yet (site/player/missing.mjs),
# one job per motion, and put it in R2 at m/<id>/<version>.mp4, where the Worker serves it. A version's video is made
# once: one already published is never replaced, and a change to the runtime or the player does not render again. A
# motion that fails to render gets no video, and its page keeps playing it live; the next run tries it again.
name: render

on:
  workflow_run:
    workflows: [deploy]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.missing.outputs.ids }}
    steps:
      # the commit that was deployed, so each video is of the version the site now serves
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - id: missing
        run: |
          ids=$(node site/player/missing.mjs https://motionhub.dev)
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
          echo "to render: $ids"

  render:
    needs: plan
    if: needs.plan.outputs.ids != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        id: ${{ fromJSON(needs.plan.outputs.ids) }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER: npx --yes wrangler@4.154.0
      ID: ${{ matrix.id }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: site/.cache/fonts
          key: fonts-${{ hashFiles('motions/**/tokens.json') }}
          restore-keys: fonts-
      - name: ffmpeg
        run: command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
      # the hub's files (for the policy /play/* is served with) and this motion's player, not the whole site
      - name: Build the player
        working-directory: site
        run: npm ci --no-audit --no-fund && node ../tools/build.mjs ../dist && node player/build.mjs "$ID"
      - name: Render
        working-directory: site
        run: node player/render.mjs "$ID" --out "$RUNNER_TEMP/render"
      - name: Publish
        run: |
          version=$(node -p "require('./motions/$ID/motion.json').version")
          key="m/$ID/$version.mp4"
          # made once: if this version's video is in R2 already (another run, or a site not yet serving it), it stays
          if $WRANGLER r2 object get "motionhub/$key" --remote --file "$RUNNER_TEMP/published.mp4" >/dev/null 2>&1; then echo "kept $key"; exit 0; fi
          $WRANGLER r2 object put "motionhub/$key" --remote --file "$RUNNER_TEMP/render/$key" --content-type video/mp4 >/dev/null
          echo "published $key ($(stat -c %s "$RUNNER_TEMP/render/$key") bytes)"
